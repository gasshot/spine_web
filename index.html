<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>보형킴의 디지털 아뜨리움</title>

    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.3.3/dist/spine-player.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.3.3/dist/iife/spine-player.js"></script>
  </head>

  <body>
    <nav class="top-nav">
      <a href="index.html" class="active">SPINE</a>
      <a href="artwork.html">ARTWORK</a>
    </nav>

    <div class="sidebar">
      <h2>SELECT SPINE</h2>
      <select
        class="skin-select"
        id="spine-selector"
        onchange="loadSpine(this.value)"
      ></select>

      <h2>SELECT SKIN</h2>
      <select
        class="skin-select"
        id="skin-selector"
        onchange="updateButtonList()"
      ></select>

      <h2>ANIMATIONS</h2>
      <div id="anim-buttons"></div>
    </div>

    <div class="main-display">
      <h1>보형킴의 스파인 아뜨리움</h1>
      <p class="subtitle">보형킴의 스파인 애니메이션 포트폴리오입니다.</p>
      <div id="player-container"></div>
    </div>

    <script>
      // --------------------------------------------------
      // 스파인 에셋 경로 관리
      // --------------------------------------------------
      const SPINE_ASSET_ROOT = "assets/spine";

      const SPINE_ASSETS = {
        new_C1: {
          label: "new_C1",
          folder: "new_C1",
          json: "new_C1.json",
          atlas: "new_C1.atlas",
        },

        // 나중에 추가 예시
        new_C3: {
          label: "new_C3",
          folder: "new_C3",
          json: "new_C3.json",
          atlas: "new_C3.atlas",
        },
        C5: {
          label: "C5",
          folder: "C5",
          json: "C5.json",
          atlas: "C5.atlas",
        },
        C6: {
          label: "C6",
          folder: "C6",
          json: "C6.json",
          atlas: "C6.atlas",
        },
        C1SD: {
          label: "C1_SD",
          folder: "C1_SD",
          json: "C1_SD.json",
          atlas: "C1_SD.atlas",
        },
      };

      let player = null;
      let currentSpineKey = "new_C1";

      function initSpineSelector() {
        const selector = document.getElementById("spine-selector");

        selector.innerHTML = Object.entries(SPINE_ASSETS)
          .map(([key, data]) => {
            return `<option value="${key}">${data.label}</option>`;
          })
          .join("");

        selector.value = currentSpineKey;
      }

      function rebuildSkinSelector() {
        if (!player || !player.skeleton) {
          return;
        }

        const selector = document.getElementById("skin-selector");

        const allSkins = player.skeleton.data.skins.map((s) => s.name);

        // default를 제외한 실제 스킨 목록
        const nonDefaultSkins = allSkins.filter((skinName) => {
          return skinName.toLowerCase() !== "default";
        });

        // 실제 스킨이 있으면 default 제외
        // 실제 스킨이 없으면 default 사용
        const skins = nonDefaultSkins.length > 0 ? nonDefaultSkins : allSkins;

        selector.innerHTML = skins
          .map((skinName) => {
            return `<option value="${skinName}">${skinName}</option>`;
          })
          .join("");

        if (skins.length > 0) {
          selector.disabled = false;
          selector.value = skins.includes("skin1") ? "skin1" : skins[0];
        } else {
          selector.disabled = true;
          selector.innerHTML = `<option value="">No Skin</option>`;
        }
      }

      function getSpineFilePath(spineKey, fileName) {
        const data = SPINE_ASSETS[spineKey];

        if (!data) {
          console.error("[Spine] 등록되지 않은 스파인 키입니다:", spineKey);
          return "";
        }

        return `${SPINE_ASSET_ROOT}/${data.folder}/${fileName}`;
      }

      function loadSpine(spineKey) {
        const data = SPINE_ASSETS[spineKey];

        if (!data) {
          console.error("[Spine] 로드 실패. 등록되지 않은 키:", spineKey);
          return;
        }

        currentSpineKey = spineKey;

        const container = document.getElementById("player-container");

        // 기존 플레이어 제거
        if (player && typeof player.dispose === "function") {
          player.dispose();
        }

        container.innerHTML = "";

        player = new spine.SpinePlayer("player-container", {
          skeleton: getSpineFilePath(spineKey, data.json),
          atlas: getSpineFilePath(spineKey, data.atlas),

          showControls: true,
          premultipliedAlpha: true,
          alpha: true,
          backgroundColor: "#00000000",
          preserveDrawingBuffer: true,
          controlImages: true,

          success: function (p) {
            onSpineLoaded(p);
          },

          error: function (p, reason) {
            console.error("[Spine] 로드 실패:", reason);
          },
        });
      }

      function onSpineLoaded(p) {
        debugSpineData(p);

        if (p.atlas && p.atlas.pages) {
          p.atlas.pages.forEach((page) => {
            if (page.texture) {
              page.texture.setFilters(
                spine.TextureFilter.Linear,
                spine.TextureFilter.Linear,
              );
            }
          });
        }

        rebuildSkinSelector();
        updateButtonList();

        setTimeout(() => {
          p.animationState.update(0);
          p.animationState.apply(p.skeleton);
          console.log("✅ 렌더링 준비 완료:", currentSpineKey);
        }, 100);
      }

      // --------------------------------------------------
      // [데이터 분석 전용 메서드]
      // --------------------------------------------------
      function debugSpineData(p) {
        console.group(
          "%c🔍 스파인 데이터 인스펙터",
          "color: #007acc; font-weight: bold;",
        );

        const allSkins = p.skeleton.data.skins.map((s) => s.name);
        const allAnims = p.skeleton.data.animations.map((a) => a.name);

        const skinMap = {};

        allSkins.forEach((skin) => {
          const matched = allAnims.filter((name) => name.includes(skin));

          skinMap[skin] = {
            Count: matched.length,
            List: matched.join(", ") || "(N/A)",
          };
        });

        console.log("👗 Skins:", allSkins);
        console.table(skinMap);
        console.groupEnd();
      }

      // --------------------------------------------------
      // UI 로직
      // --------------------------------------------------
      function resetSlotsToSetupPose(skeleton) {
        if (!skeleton) return;

        // Spine 4.3
        if (typeof skeleton.setupPoseSlots === "function") {
          skeleton.setupPoseSlots();
          return;
        }

        // Spine 4.2 이하 호환
        if (typeof skeleton.setSlotsToSetupPose === "function") {
          skeleton.setSlotsToSetupPose();
          return;
        }

        console.warn(
          "[Spine] setup pose 슬롯 초기화 메서드를 찾을 수 없습니다.",
          skeleton,
        );
      }

      function createDynamicButtons(animNames) {
        const selectedSkin = document.getElementById("skin-selector").value;
        const buttonContainer = document.getElementById("anim-buttons");

        if (!player || !player.skeleton) {
          return;
        }

        const targetSkin = player.skeleton.data.findSkin(selectedSkin);

        if (targetSkin) {
          player.skeleton.setSkin(targetSkin);
          resetSlotsToSetupPose(player.skeleton);
        } else {
          console.warn("[Spine] 존재하지 않는 스킨입니다:", selectedSkin);
        }

        // 1. _NO_USE가 붙은 애니메이션은 먼저 제외
        const usableAnims = animNames.filter((name) => {
          return !name.toUpperCase().includes("_NO_USE");
        });

        // 2. 선택한 skin 이름으로 시작하는 애니메이션만 찾기
        const filtered = usableAnims.filter((name) => {
          return name.startsWith(selectedSkin);
        });

        // 3. skin 전용 애니메이션이 있으면 그것만 표시
        //    없으면 C3처럼 공용 애니메이션 전체 표시
        const targetList = filtered.length > 0 ? filtered : usableAnims;

        buttonContainer.innerHTML = targetList
          .map(
            (name) => `
          <button class="menu-btn" onclick="changeAnim('${name}')">
            🎬 ${
              name
                .split("/")
                .pop()
                .replace(selectedSkin + "_", "")
                .trim() || name
            }
          </button>
        `,
          )
          .join("");

        if (targetList.length > 0) {
          changeAnim(targetList[0]);
        }
      }

      function updateButtonList() {
        if (!player || !player.skeleton) {
          return;
        }

        const realAnims = player.skeleton.data.animations.map((a) => a.name);
        createDynamicButtons(realAnims);
      }

      function changeAnim(name) {
        if (!player || !player.animationState) {
          return;
        }

        try {
          player.animationState.setAnimation(0, name, true);
        } catch (e) {
          console.error("재생 실패:", name, e);
        }
      }

      // 페이지 시작 시 기본 스파인 로드
      window.addEventListener("DOMContentLoaded", function () {
        initSpineSelector();
        loadSpine(currentSpineKey);
      });
    </script>
  </body>
</html>
